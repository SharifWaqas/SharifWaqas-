  <circle cx="1132" cy="206" r="3"/>
</g>

<!-- tier 3 converging to storage cluster -->
<g stroke="#5E6AD2" stroke-width="0.6" opacity="0.11">
  <line x1="1136" y1="176" x2="1230" y2="188"/>
  <line x1="1136" y1="192" x2="1230" y2="190"/>
  <line x1="1136" y1="206" x2="1230" y2="192"/>
</g>

<!-- storage, abstracted as concentric circles rather than an icon -->
<g stroke="#8B7CF6" fill="none" opacity="0.13">
  <circle cx="1232" cy="190" r="16" stroke-width="0.6"/>
  <circle cx="1232" cy="190" r="10" stroke-width="0.6"/>
