  <circle cx="992" cy="200" r="2.6"/>
  <circle cx="992" cy="240" r="3.8"/>
  <circle cx="992" cy="280" r="2.2"/>
</g>

<!-- tier 2 converging to tier 3 (aggregation) -->
<g stroke="#5E6AD2" stroke-width="0.6" opacity="0.11">
  <path d="M995,120 C1060,130 1090,160 1130,175" fill="none"/>
