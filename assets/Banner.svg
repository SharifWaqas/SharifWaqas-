<line x1="1246" y1="200" x2="1320" y2="270" stroke="#5E6AD2" stroke-width="0.5" opacity="0.07"/>
<g fill="#8B7CF6">
  <circle cx="1324" cy="268" r="1.4" opacity="0.11"/>
  <circle cx="1338" cy="278" r="1.4" opacity="0.17"/>
