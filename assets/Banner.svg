<text x="80" y="106" font-size="13" font-weight="600" letter-spacing="2.5" fill="#8B7CF6">BACKEND SYSTEMS · AI INFRASTRUCTURE</text>

<text x="80" y="176" font-size="54" font-weight="600" letter-spacing="-0.5" fill="#F7F8F8">Sharif Waqas<tspan fill="#5E6AD2">.</tspan></text>

<text font-size="17" font-weight="400" fill="#8A8F98">
  <tspan x="80" y="222">Engineering reliable backend systems where performance</tspan>
  <tspan x="80" y="248">meets simplicity.</tspan>
</text>

<line x1="80" y1="300" x2="1360" y2="300" stroke="#17181C" stroke-width="1"/>

<g font-size="14" font-weight="500" letter-spacing="0.2" fill="#C4C7CF">
  <text x="80" y="336">Distributed Systems</text>
  <text x="266" y="336" fill="#3A3B42">/</text>
  <text x="284" y="336">System Design</text>
  <text x="446" y="336" fill="#3A3B42">/</text>
  <text x="464" y="336">Backend APIs</text>
  <text x="608" y="336" fill="#3A3B42">/</text>
